name: Buddhi AI Evaluations

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  eval-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Graph Invariant Tests
        run: |
          pytest tests/test_graph_evals.py -v

      - name: Run MCP Tests
        run: |
          pytest tests/test_mcp.py -v

      - name: Run Token Benchmark Suite
        run: |
          buddhi benchmark
