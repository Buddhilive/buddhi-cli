name: Publish Buddhi AI CLI to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build, Verify, and Publish
    runs-on: ubuntu-latest
    
    # Required permissions for OIDC Trusted Publisher authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv-action@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Release Dependencies
        run: |
          uv sync --group dev

      - name: Build Package Distributions
        run: |
          uv run python -m build

      - name: Verify Package Metadata (twine check)
        run: |
          uv run twine check dist/*

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          # Note: No username or password specified; OIDC Trusted Publisher 
          # must be configured on PyPI side for the repo: Buddhilive/buddhi-cli
