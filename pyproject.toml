[build-system]
requires = ["setuptools>=42", "wheel", "huggingface_hub"]
build-backend = "setuptools.build_meta"

[project]
name = "buddhi-ai"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "pydantic-settings>=2.2.1",
    "sse-starlette>=2.0.0",
    "litert-lm-api",
    "huggingface_hub[cli]",
    "aiofiles>=24.1.0",
    "textual>=0.75.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "streamlit>=1.35.0",
]

[project.scripts]
buddhi = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["server*", "cli*"]

[tool.setuptools.exclude-package-data]
"server.static.model" = ["*"]
