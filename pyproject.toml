[build-system]
requires = ["setuptools>=42", "wheel", "huggingface_hub"]
build-backend = "setuptools.build_meta"

[project]
name = "buddhi-ai"
version = "2.0.0-beta.2"
description = "Buddhi AI - Intelligent Development Assistant"
readme = "README.md"
requires-python = ">=3.10"
urls.documentation = "https://github.com/Buddhilive/buddhi-ai#readme"
urls.homepage = "https://buddhilive.com"
urls.issues = "https://github.com/Buddhilive/buddhi-ai/issues"
urls.repository = "https://github.com/Buddhilive/buddhi-ai"
license = "MIT"
authors = [{ name = "Buddhi Kavindra", email = "info@buddhilive.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "pydantic-settings>=2.2.1",
    "sse-starlette>=2.0.0",
    "litert-lm-api",
    "huggingface_hub[cli]",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "mcp>=0.1.0",
    "networkx>=3.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-languages>=1.10.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
]

[project.scripts]
buddhi = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["server*", "cli*", "ui*", "mcp*"]
namespaces = true

[tool.setuptools.exclude-package-data]
"server.static.model" = ["*"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
exclude = ['^main\.py$', '^tests/', '^server/', '^ui/']

[tool.ruff]
exclude = ["server", "ui"]

[tool.ruff.lint]
ignore = ["F401", "E741", "E402"]
