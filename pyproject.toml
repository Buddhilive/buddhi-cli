[project]
name = "buddhi-ai"
version = "1.0.0-beta.5"
description = "Buddhi AI CLI"
readme = "README.md"
authors = [{ name = "Buddhi Kavindra", email = "info@buddhilive.com" }]
license = { file = "LICENSE" }
keywords = ["ast", "tree-sitter", "mcp", "cli", "code-search", "boilerplate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "igraph>=1.0.0",
    "mcp>=1.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-haskell>=0.23.1",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-swift>=0.7.2",
    "tree-sitter-typescript>=0.23.2",
    "tiktoken>=0.9.0",
    "textual>=0.86.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "litert-lm-api>=0.1.0",
    "psutil>=5.9.0",
    "huggingface_hub>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/Buddhilive/buddhi-cli"
Repository = "https://github.com/Buddhilive/buddhi-cli.git"
Issues = "https://github.com/Buddhilive/buddhi-cli/issues"

[project.scripts]
buddhi = "buddhi_ai.cli:main"
buddhi-mcp = "buddhi_ai.mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.1.0", "pytest>=9.0.3", "ruff>=0.15.15"]
