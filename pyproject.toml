[project]
name = "buddhi"
version = "0.1.0"
description = "Buddhi is a command-line tool that helps you find and fix issues in your code."
readme = "README.md"
authors = [{ name = "Buddhi Kavindra", email = "info@buddhilive.com" }]
requires-python = ">=3.10"
dependencies = [
    "igraph>=1.0.0",
    "pathspec>=1.1.1",
    "rich>=15.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-swift>=0.7.3",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.27.1",
]

[project.scripts]
buddhi = "buddhi:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.3"]
