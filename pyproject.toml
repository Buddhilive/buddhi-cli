[project]
name = "buddhi-ai-server"
version = "0.1.0"
description = "Buddhi AI Server - A Textual CLI Application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Buddhi" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "textual>=0.83.0",
    "textual-pyfiglet>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/buddhi/buddhi-ai-server"

[project.scripts]
buddhi-ai = "buddhi_ai_server.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
