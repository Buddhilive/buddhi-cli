[build-system]
requires = ["setuptools>=42", "wheel", "huggingface_hub"]
build-backend = "setuptools.build_meta"

[project]
name = "buddhi-ai"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "pydantic-settings>=2.2.1",
    "sse-starlette>=2.0.0",
    "litert-lm-api",
    "huggingface_hub[cli]",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "mcp>=0.1.0",
    "networkx>=3.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-languages>=1.10.0",
]

[project.scripts]
buddhi = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["server*", "cli*"]

[tool.setuptools.exclude-package-data]
"server.static.model" = ["*"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
exclude = [
    '^main\.py$',
    '^tests/',
    '^server/',
    '^ui/',
]

[tool.ruff]
exclude = [
    "server",
    "ui",
]

[tool.ruff.lint]
ignore = ["F401", "E741", "E402"]
