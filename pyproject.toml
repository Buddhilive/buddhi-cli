[project]
name = "buddhi-cli"
version = "0.1.0"
description = "Buddhi CLI Tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
buddhi = "buddhi_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddhi_cli"]
